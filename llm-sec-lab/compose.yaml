networks:
  lab-net:
    driver: bridge

services:

  juice-shop:
    image: ${JUICE_SHOP_IMAGE:?Run python -B run_pipeline.py --capture-environment-lock first}
    container_name: juice-shop
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    ports:
      - "3000:3000"
    networks:
      - lab-net

  vulnerable-app:
    image: ${VULNERABLE_APP_IMAGE:?Run python -B run_pipeline.py --capture-environment-lock first}
    container_name: vulnerable-app
    ports:
      - "9090:9090"
    networks:
      - lab-net

  zap:
    image: ${ZAP_IMAGE:?Run python -B run_pipeline.py --capture-environment-lock first}
    container_name: zap
    environment:
      ZAP_PORT: "8090"
    ports:
      - "8090:8090"
    networks:
      - lab-net
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8090
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    depends_on:
      - juice-shop
      - vulnerable-app
